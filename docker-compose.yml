# ===========================================================
# Agentic Lab — Infrastructure Services
# ===========================================================
# PostgreSQL : Run history, iterations, checkpoints, configs
# Redis      : Real-time pub/sub, caching, ephemeral state
# Qdrant     : Vector store for semantic memory across runs
# Grafana    : Observability dashboards
# Prometheus : Metrics collection (time series)
# pgAdmin    : DB administration UI
# ===========================================================

services:
  # -----------------------------------------------------------
  # PostgreSQL — Main relational store
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: alab-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic_lab_secret}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_lab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentic}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # Redis — Pub/Sub, caching, ephemeral state
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: alab-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -----------------------------------------------------------
  # Qdrant — Vector store for semantic memory
  # -----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: alab-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -----------------------------------------------------------
  # Prometheus — Metrics collection
  # -----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: alab-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"

  # -----------------------------------------------------------
  # Grafana — Observability dashboards
  # -----------------------------------------------------------
  grafana:
    image: grafana/grafana:11.5.2
    container_name: alab-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-agentic_lab}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      prometheus:
        condition: service_started
      postgres:
        condition: service_healthy

  # -----------------------------------------------------------
  # pgAdmin — Database administration UI
  # -----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: alab-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@agenticlab.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - admin

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  pgadmin_data:
    driver: local
