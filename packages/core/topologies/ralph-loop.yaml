      - {$component_ref: rounds.next.14}
      - {$component_ref: rounds.next.15}
      - {$component_ref: rounds.next.16}
      - {$component_ref: rounds.next.17}
      - {$component_ref: rounds.next.18}
      - {$component_ref: rounds.next.19}
      - {$component_ref: rounds.next.20}
      - {$component_ref: rounds.limit}
    control_flow_connections:
      - {component_type: ControlFlowEdge, id: rounds.cf.start, name: count, from_node: {$component_ref: rounds.start}, to_node: {$component_ref: rounds.check}}
      - {component_type: ControlFlowEdge, id: rounds.cf.2, name: round 1 done, from_node: {$component_ref: rounds.check}, from_branch: r1, to_node: {$component_ref: rounds.next.2}}
      - {component_type: ControlFlowEdge, id: rounds.cf.3, name: round 2 done, from_node: {$component_ref: rounds.check}, from_branch: r2, to_node: {$component_ref: rounds.next.3}}
      - {component_type: ControlFlowEdge, id: rounds.cf.4, name: round 3 done, from_node: {$component_ref: rounds.check}, from_branch: r3, to_node: {$component_ref: rounds.next.4}}
      - {component_type: ControlFlowEdge, id: rounds.cf.5, name: round 4 done, from_node: {$component_ref: rounds.check}, from_branch: r4, to_node: {$component_ref: rounds.next.5}}
      - {component_type: ControlFlowEdge, id: rounds.cf.6, name: round 5 done, from_node: {$component_ref: rounds.check}, from_branch: r5, to_node: {$component_ref: rounds.next.6}}
