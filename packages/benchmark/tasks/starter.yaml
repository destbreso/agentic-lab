# The starter task set of jig-benchmark.
# Three questions with one exact answer, written to a file, and two small Python tasks, each checked by a command that exits 0
# when the task is done. The expected answers and the hidden tests are check files given with their content: they exist only
# in the copy where the lab runs the checks, so no role can read them, and a failing check prints nothing that gives them away.
# The questions are variations on puzzles of the old dashboard's problem bank (the bat and the ball, the fence posts, the
# birthday paradox, FizzBuzz with a twist), with new numbers so a model cannot answer from memory alone.
# Python 3 is the only thing the checks need.
name: starter
description: Three questions with one exact answer and two small Python tasks, each meant to be within reach of a 7B local model sometimes but not always.

tasks:
  - id: pen-and-notebook
    tags: [reasoning]
    task: |
      A notebook and a pen cost $2.30 together. The notebook costs $2.00 more than the pen.
      How much does the pen cost, in dollars? Write only the number, with two decimals and no currency sign (for example 1.25), to a file named answer.txt.
    checks:
      - python3 .checks/answer.py
    check_files:
      - path: .checks/answer.py
        content: |
          import sys
          try:
              got = open("answer.txt", encoding="utf-8").read().strip()
          except OSError:
              sys.exit("answer.txt is missing")
          sys.exit(0 if got == "0.15" else "answer.txt does not hold the expected answer")
    direct: {answer_file: answer.txt}

  - id: fence-posts
    tags: [reasoning]
    task: |
      A straight fence is 120 meters long. It has a post at each end, and a post every 8 meters between them.
      How many posts does it have? Write only the number to a file named answer.txt.
    checks:
      - python3 .checks/answer.py
    check_files:
      - path: .checks/answer.py
        content: |
          import sys
          try:
              got = open("answer.txt", encoding="utf-8").read().strip()
          except OSError:
              sys.exit("answer.txt is missing")
          sys.exit(0 if got == "16" else "answer.txt does not hold the expected answer")
    direct: {answer_file: answer.txt}

  - id: birthday-23
    tags: [reasoning]
    task: |
      There are 23 people in a room. Each one's birthday is equally likely to be any of 365 days, independently of the others (ignore February 29).
      What is the probability that at least two of them share a birthday? Write only the probability as a decimal rounded to three places (for example 0.123) to a file named answer.txt.
    checks:
      - python3 .checks/answer.py
    check_files:
      - path: .checks/answer.py
        content: |
          import sys
          try:
              got = open("answer.txt", encoding="utf-8").read().strip()
          except OSError:
              sys.exit("answer.txt is missing")
          sys.exit(0 if got == "0.507" else "answer.txt does not hold the expected answer")
    direct: {answer_file: answer.txt}

  - id: fizzbuzz-digits
    tags: [coding, python]
    task: |
      Write fizzbuzz.py with a function fizzbuzz(n) that returns a list of strings, one for each number from 1 to n.
      A number is "Fizz" when it is divisible by 3 or contains the digit 3, "Buzz" when it is divisible by 5 or contains the digit 5, and "FizzBuzz" when it is both. Any other number is the number itself, as a string.
      For example, 13 is "Fizz", 52 is "Buzz", 35 is "FizzBuzz" and 53 is "FizzBuzz".
    checks:
      - python3 .checks/test_fizzbuzz.py
    check_files:
      - path: .checks/test_fizzbuzz.py
        content: |
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          try:
              from fizzbuzz import fizzbuzz
          except Exception as e:
              sys.exit(f"fizzbuzz.py could not be imported: {e}")

          def expected(i):
              fizz = i % 3 == 0 or "3" in str(i)
              buzz = i % 5 == 0 or "5" in str(i)
              return "FizzBuzz" if fizz and buzz else "Fizz" if fizz else "Buzz" if buzz else str(i)

          got = fizzbuzz(100)
          if not isinstance(got, list) or len(got) != 100:
              sys.exit("fizzbuzz(100) is not a list of 100 strings")
          for i, value in enumerate(got, start=1):
              if value != expected(i):
                  sys.exit(f"fizzbuzz(100)[{i - 1}], for {i}, is {value!r}, not {expected(i)!r}")
    direct: {file: fizzbuzz.py}

  - id: median-fix
    tags: [coding, python, bug-fix]
    task: |
      The function median in stats.py has bugs. Fix stats.py so that the tests in test_stats.py pass (python3 -m unittest test_stats runs them).
      Do not change test_stats.py.
    files:
      stats.py: |
        def median(values):
            """Return the median of a list of numbers."""
            values.sort()
            middle = len(values) // 2
            return values[middle]
      test_stats.py: |
        import unittest

        from stats import median


        class MedianTest(unittest.TestCase):
            def test_odd_length(self):
                self.assertEqual(median([3, 1, 2]), 2)

            def test_even_length(self):
                self.assertEqual(median([4, 1, 3, 2]), 2.5)

            def test_does_not_change_its_input(self):
                values = [3, 1, 2]
                median(values)
                self.assertEqual(values, [3, 1, 2])

            def test_empty_list_raises(self):
                with self.assertRaises(ValueError):
                    median([])


        if __name__ == "__main__":
            unittest.main()
    checks:
      - python3 -m unittest -q test_stats
    check_files:
      - test_stats.py
    direct: {file: stats.py}
