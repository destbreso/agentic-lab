# Prometheus configuration for Agentic Lab
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Scrape configs
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Agentic Lab metrics endpoint (exposed by the web/API server)
  - job_name: "agentic-lab"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:3000"]
    metrics_path: "/api/metrics"

  # Node exporter (optional, if running)
  - job_name: "node"
    static_configs:
      - targets: ["host.docker.internal:9100"]
